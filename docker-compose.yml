services:
  redis:
    image: redis:latest
    container_name: rateLimiter-redis
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 134217728 --maxmemory-policy allkeys-lru

volumes:
  redis_data: